# TEMPLATE mac-swift.yml from MANTRA_MANIFEST/workflows (source: G815_LIGHTS build.yml). Change APP (the .app name in
# build/) and VERSION_FILE. build.sh must sign with "${SIGN:-Mantra Apps}"; here SIGN=- (ad hoc). On the Mac the
# release zip is downloaded, unzipped into /Applications and re-signed "Mantra Apps" (workflows/README.md, Install).
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  APP: "Download, Copy and Move (Mantra)"
  VERSION_FILE: app/App.swift
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: MediaInfo inside the app (v8, MediaArea's own Mac command line)
        run: |
          MI=26.05
          curl -fsSL -o mi.dmg "https://mediaarea.net/download/binary/mediainfo/$MI/MediaInfo_CLI_${MI}_Mac.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/mi mi.dmg
          mkdir -p vendor
          B=$(find /tmp/mi -type f -name mediainfo -perm -u+x | head -1)
          if [ -z "$B" ]; then
            P=$(find /tmp/mi -name '*.pkg' | head -1); pkgutil --expand-full "$P" /tmp/mipkg
            B=$(find /tmp/mipkg -type f -name mediainfo -perm -u+x | head -1)
          fi
          cp "$B" vendor/mediainfo; hdiutil detach /tmp/mi
          file vendor/mediainfo; otool -L vendor/mediainfo; vendor/mediainfo --Version
      - name: Build
        run: SIGN=- NO_INSTALL=1 ./build.sh
      - name: Pack
        run: cd build && ditto -c -k --keepParent "$APP.app" app.zip
      - name: Release (Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^let VERSION = \([0-9]*\)/\1/p' "$VERSION_FILE")
          if gh release view "v$V" >/dev/null 2>&1; then gh release upload "v$V" build/app.zip --clobber
          else gh release create "v$V" build/app.zip --target "$GITHUB_SHA" --latest --title "$APP v$V" --notes "$(git log -1 --format=%s)"; fi
